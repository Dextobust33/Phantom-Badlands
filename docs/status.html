<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Badlands — Who's Online</title>
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="Who is currently playing Phantom Badlands, updated every few minutes.">
<!--
  Reads a small JSON the game server PATCHes into a gist every few minutes. Nothing is served
  from the game host: it runs only SSH and the game port, and adding a web server there would be
  a new open port and another thing to patch, for a read-only list.

  This page uses the SITE stylesheet rather than its own. It shipped with a private palette and
  looked like somebody else's website sitting behind the same nav bar.
-->
<style>
  .status-count { font-size: 2.2rem; color: var(--green); font-weight: 600; line-height: 1.2; }
  .status-sub { color: var(--text-secondary); font-size: .9rem; margin-bottom: 1.2rem; }
  .status-table { width: 100%; border-collapse: collapse; margin-top: .5rem; }
  .status-table th { text-align: left; font-size: .72rem; text-transform: uppercase;
        letter-spacing: .08em; color: var(--text-secondary);
        border-bottom: 1px solid var(--border); padding: .5rem .6rem; }
  .status-table td { padding: .6rem; border-bottom: 1px solid var(--border); }
  .status-table td.lv { color: var(--gold); white-space: nowrap; }
  .status-table td.cls { color: var(--cyan); }
  .status-table td.where { color: var(--text-secondary); }
  .status-empty { padding: 1.6rem .6rem; color: var(--text-secondary); }
  .status-err { color: var(--red); }
  @media (max-width: 480px) { .status-table td.where, .status-table th.where { display: none; } }
</style>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="index.html" class="logo">Phantom Badlands</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="features.html">Features</a>
                <a href="download.html">Download</a>
                <a href="status.html" class="active">Who's Online</a>
                <a href="faq.html">FAQ</a>
                <a href="https://discord.gg/5AuceNN2dZ" target="_blank">Discord</a>
                <a href="https://github.com/Dextobust33/Phantom-Badlands/discussions" target="_blank">Forum</a>
            </div>
        </div>
    </nav>

    <main>
        <div class="page-content">
            <h1>Who's Online</h1>
            <div class="status-sub" id="updated">loading…</div>
            <div class="status-count" id="count">—</div>
            <div id="body"></div>
        </div>
    </main>

<script>
// The gist the game server PATCHes. The `/raw/` URL with no commit sha always serves the
// LATEST revision, and it comes back with `Access-Control-Allow-Origin: *`, so this page can
// read it directly with no key and no backend of our own.
const GIST_URL = "https://gist.githubusercontent.com/Dextobust33/dbd09bea1d98c04b918ea57d867a5f2d/raw/status.json";
function ago(unix){
  const s = Math.max(0, Math.floor(Date.now()/1000 - unix));
  if (s < 90) return s + " seconds ago";
  const m = Math.floor(s/60);
  if (m < 90) return m + " minutes ago";
  return Math.floor(m/60) + " hours ago";
}
function render(d){
  document.getElementById("updated").textContent = "updated " + ago(d.updated);
  const n = d.count|0;
  document.getElementById("count").textContent = n === 0 ? "nobody online" : n + (n===1?" player online":" players online");
  const body = document.getElementById("body");
  if (!n) { body.innerHTML = '<div class="status-empty">The badlands are quiet.</div>'; return; }
  const rows = d.players.map(p =>
    `<tr><td>${esc(p.name)}</td><td class="lv">Lv ${p.level|0}</td>` +
    `<td class="cls">${esc(p.class)}</td><td class="where">${esc(p.where)}</td></tr>`).join("");
  body.innerHTML = `<table class="status-table"><thead><tr><th>Name</th><th>Level</th><th>Class</th>` +
    `<th class="where">Last seen near</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
async function load(){
  if (!GIST_URL) {
    document.getElementById("updated").innerHTML =
      '<span class="status-err">Not configured yet — set GIST_URL in status.html.</span>';
    return;
  }
  try {
    const r = await fetch(GIST_URL + "?t=" + Date.now(), {cache:"no-store"});
    render(await r.json());
  } catch (e) {
    document.getElementById("updated").innerHTML =
      '<span class="status-err">Could not reach the status feed.</span>';
  }
}
load();
setInterval(load, 120000); // the server only republishes every ~3 min; polling faster buys nothing
</script>
</body>
</html>
